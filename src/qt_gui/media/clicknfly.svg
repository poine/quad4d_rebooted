<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B231D"/>
      <stop offset="1" stop-color="#0E1512"/>
    </linearGradient>
  </defs>

  <!-- rounded dark tile, same family as the operator HMI -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none"
        stroke="#2A312D" stroke-width="1"/>

  <!-- show trajectory: a figure-of-eight the drone is flying -->
  <path d="M64 168 C 64 118, 192 118, 192 168" fill="none"
        stroke="#00E676" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <path d="M64 168 C 64 214, 192 214, 192 168" fill="none"
        stroke="#00E676" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="10 12" opacity="0.35"/>

  <!-- quadrotor, seen from above -->
  <g stroke="#E8ECEA" stroke-width="9" stroke-linecap="round">
    <line x1="92" y1="76" x2="164" y2="132"/>
    <line x1="164" y1="76" x2="92" y2="132"/>
  </g>
  <g fill="none" stroke="#E8ECEA" stroke-width="7">
    <circle cx="86" cy="70" r="21"/>
    <circle cx="170" cy="70" r="21"/>
    <circle cx="86" cy="138" r="21"/>
    <circle cx="170" cy="138" r="21"/>
  </g>
  <!-- body -->
  <rect x="112" y="88" width="32" height="32" rx="9" fill="#FFD400"/>
</svg>
